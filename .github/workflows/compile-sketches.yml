name: Compile sketches

# Compiles every sketch folder in the repository for the ESP32 Dev Module,
# the same way Arduino IDE builds a .ino sketch.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    name: ESP32 Dev Module (esp32 3.3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Compile all sketches
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.12
          # Every library used (Wire, SPI, EEPROM, SD, ESP-IDF drivers) comes with the ESP32 core.
          libraries: '[]'
          sketch-paths: |
            - ./
